name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [GXXE01, NXXJ01]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Check Python syntax
      run: python -m compileall -q configure.py tools
    - name: Check build configuration
      run: python configure.py --map --version ${{ matrix.version }}
    - name: Explain full-build requirements
      if: ${{ github.repository != 'TeamOrre/xd-decomp' && vars.BUILD_CONTAINER == '' }}
      run: |
        echo 'Only configuration was checked; compilation and progress were not run.' >> "$GITHUB_STEP_SUMMARY"
        echo 'Set BUILD_CONTAINER to an accessible private build image. See docs/github_actions.md.' >> "$GITHUB_STEP_SUMMARY"

  build:
    # Private game files must come from an image accessible to this repository.
    # Never expose the image to untrusted pull-request code.
    if: >-
      github.event_name != 'pull_request' &&
      (github.repository == 'TeamOrre/xd-decomp' || vars.BUILD_CONTAINER != '')
    needs: configure
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ vars.BUILD_CONTAINER || 'ghcr.io/teamorre/xd-decomp-build:main' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add game versions here
        version: [GXXE01, NXXJ01]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Set Git config
    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Normalize file mod times
    - name: Restore timestamps
      run: |
        uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime \
            --merge --commit-time

    # Copy the original files to the workspace
    - name: Prepare
      run: cp -a /orig .

    # Restore cached files
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build
          .ninja_deps
          .ninja_log
        key: ${{ runner.os }}-${{ matrix.version }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ matrix.version }}-

    # Build the project
    - name: Build
      run: |
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja all_source progress build/${{ matrix.version }}/report.json

    # Upload map files
    - name: Upload map
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    # Upload progress report
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json
        if-no-files-found: error
